[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-shield"
version = "0.0.1"
description = "Provenance-aware trust layer for document RAG: canonicalize, quarantine, audit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "markdown-it-py>=3.0",
    "beautifulsoup4>=4.12",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "fastapi>=0.110",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "streamlit>=1.38",
    # pydantic-core >= 2.34 wheels were blocked by Windows Smart App Control on the dev
    # machine (no reputation yet); 2.11.x (core 2.33) loads. Revisit when reputations catch up.
    "pydantic>=2.7,<2.12",
]

[project.scripts]
rag-shield = "rag_shield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_shield = ["policy/*.yaml"]

[tool.pytest.ini_options]
# repo root on sys.path so `eval` and `scripts` are importable in tests
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "eval/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# regex cue table reads best one cue per line
"src/rag_shield/layer2/linguistic.py" = ["E501"]
