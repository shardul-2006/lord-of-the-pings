# RAG-Shield screening policy (Spec E). Tune on the dev split only, never on test.
version: policy_v1

thresholds:
  quarantine: 0.70        # fused score >= this -> quarantined (that sentence only)
  review: 0.40            # fused score >= this -> review_required
  directive: 0.50         # linguistic score counted as "directive syntax"
  strong_hiding: 0.70     # hiding weight counted as a "strong hiding signal"

routing:
  # A chunk passes the cheap gate only if BOTH maxima are below these AND it has no
  # hiding or carrier signal. Everything else escalates to the guard model.
  clear_clean_classifier: 0.20
  clear_clean_linguistic: 0.20

fusion:
  weights:
    semantic: 0.45        # guard score if escalated, else calibrated classifier
    linguistic: 0.35
    hiding: 0.40
    carrier: 0.20         # only amplifies existing directive evidence
  signal_weights:         # hiding signals; carriers are listed separately
    tiny_font: 1.0
    low_contrast: 1.0
    off_page: 1.0
    unicode_tag: 0.8
    zero_width_run: 0.8
    bidi_control: 0.8
    hidden_comment: 0.7
    hidden_element: 0.7
  carrier_signals: [metadata, alt_text]
  # Evidence sources used by fusion. All on in normal use; the ablation turns them off.
  components:
    linguistic: true
    layout: true            # hiding + carrier signals
    guard: true             # second-pass guard on escalated chunks
    hard_rule: true         # strong hiding + directive -> quarantined

guard:
  kind: rule              # rule | deberta  (env RAG_SHIELD_GUARD overrides)
  timeout_s: 20

chunk_max_chars: 300

# Source trust tiers (Layer 3). A tier deep-merges over the settings above.
# The hard rule "strong hiding + directive -> quarantined" applies in every tier.
default_tier: external_upload
tiers:
  external_upload:          # untrusted uploads: base thresholds, datamarked context
    spotlight: {datamark: true}
  internal_kb:              # curated internal pages: instructions are more often legitimate
    thresholds: {quarantine: 0.90, review: 0.80}
    spotlight: {datamark: false}

# Decision-integrity check (Spec H). Optional high-stakes mode; extra LLM calls, so it is
# timed separately from the middleware budget.
integrity:
  threshold: 20             # material change in score (0-100 scale)
  runs: 3                   # repeated runs per condition; variance is reported
  max_controls: 5           # benign-removal control passages per check
  rubric: >-
    Score the candidate from 0 to 100 for fit to the task, using only the evidence given.
    Reply with JSON: {"score": <0-100>, "verdict": "<advance|reject>",
    "supporting_evidence_ids": [<ids of the evidence lines you relied on>]}.

# Dataset Gate (batch screening). Quarantine, never delete.
dataset_gate:
  near_duplicate_threshold: 0.90  # char 3-5 gram TF-IDF cosine; flagged for review only
  trigger:
    min_count: 3                  # token must occur in at least this many rows
    max_doc_freq: 0.05            # ... and in at most this share of rows (rare)
    min_purity: 0.90              # share of its rows with the same label
    min_disagreement: 0.50        # share of its rows whose label disagrees with a model
                                  # that sees the row WITHOUT the token
  quarantine_review_required: true
  timeout_s: 600                  # whole-dataset analysis budget; timeout -> scan_failed

# Output validation (Layer 4)
output:
  allowed_domains: []       # links/images to these domains (and subdomains) are kept
  require_citations: true
